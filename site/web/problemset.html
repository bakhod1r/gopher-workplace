<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gopher workplace · problems</title>
<link rel="stylesheet" href="assets/css/styles.css?v=27">
<link rel="stylesheet" href="assets/css/roadmap.css?v=27">
<link rel="stylesheet" href="assets/css/problemset.css?v=27">
</head>
<body>
  <div class="nav">
    <div class="brand"><span class="logo">🐹</span> gopher workplace</div>
    <div class="rm-nav">
      <a href="index.html">home</a>
      <a href="roadmap.html">roadmap</a>
      <a href="problemset.html" class="on">problems</a>
    </div>
    <div class="actions">
      <select class="navbtn" id="theme" title="theme">
        <option value="light">☀ light</option>
        <option value="dark">🌙 dark</option>
      </select>
    </div>
  </div>

  <div class="ps">
    <div class="ps-head">
      <h1>problems</h1>
      <div class="ps-stats" id="psStats"></div>
    </div>

    <div class="ps-filters">
      <input id="psSearch" class="ps-search" type="text" placeholder="Search challenges…">
      <div class="ps-ms" id="psLevel" data-all="All levels">
        <button type="button" class="ps-sel ps-ms-btn" aria-haspopup="true" aria-expanded="false">All levels ▾</button>
        <div class="ps-ms-menu" hidden>
          <label><input type="checkbox" value="J">Junior</label>
          <label><input type="checkbox" value="M">Middle</label>
          <label><input type="checkbox" value="S">Senior</label>
          <label><input type="checkbox" value="ST">Staff</label>
        </div>
      </div>
      <div class="ps-ms" id="psTag" data-all="All tags">
        <button type="button" class="ps-sel ps-ms-btn" aria-haspopup="true" aria-expanded="false">All tags ▾</button>
        <div class="ps-ms-menu" hidden></div>
      </div>
      <div class="ps-ms" id="psStatus" data-all="All status">
        <button type="button" class="ps-sel ps-ms-btn" aria-haspopup="true" aria-expanded="false">All status ▾</button>
        <div class="ps-ms-menu" hidden>
          <label><input type="checkbox" value="solved">Solved</label>
          <label><input type="checkbox" value="todo">Todo</label>
          <label><input type="checkbox" value="locked">Locked</label>
        </div>
      </div>
      <button id="psRandom" class="ps-random" title="Open a random playable puzzle">🎲 random</button>
      <button id="psReset" class="ps-reset">reset</button>
    </div>

    <div class="ps-tablewrap">
      <table class="ps-table">
        <thead>
          <tr>
            <th class="c-st">Status</th>
            <th class="c-ti">Title</th>
            <th class="c-tp">Topic</th>
            <th class="c-df">Difficulty</th>
            <th class="c-tg">Tags</th>
          </tr>
        </thead>
        <tbody id="psBody"></tbody>
      </table>
      <div id="psEmpty" class="ps-empty" hidden>No challenges match your filters.</div>
    </div>
  </div>

  <script src="assets/js/localrunner.js?v=27"></script>
  <script src="assets/js/problems.js?v=27"></script>
  <script src="assets/js/progress.js?v=27"></script>
  <script src="assets/js/problemset.js?v=27"></script>
  <script>
    (function(){
      const sel=document.getElementById('theme');
      const saved=localStorage.getItem('gw-theme')||'light';
      document.documentElement.setAttribute('data-theme',saved); sel.value=saved;
      sel.addEventListener('change',()=>{ document.documentElement.setAttribute('data-theme',sel.value); localStorage.setItem('gw-theme',sel.value); });
    })();
  </script>
</body>
</html>
