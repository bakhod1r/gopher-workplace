# Deploy the static site on Netlify.
#
# NOTE: the published site is BROWSE-ONLY. Running code needs the local runner
# (site/cmd/localrunner), which executes the real Go toolchain on the visitor's
# own machine and only accepts loopback connections. A hosted deploy therefore
# renders the catalogue, descriptions and editor, but Run/Submit stay disabled
# until the visitor starts the runner locally.
#
# The build step regenerates web/assets/js/problems.js from the challenges/ tree.
[build]
  publish = "web"
  command = "./scripts/build.sh"

[build.environment]
  GO_VERSION = "1.26"
